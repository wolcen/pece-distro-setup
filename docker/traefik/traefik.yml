global:
  checkNewVersion: false
  sendAnonymousUsage: false
# Writing Logs to a File, in JSON
log:
  level: DEBUG
  filePath: "/var/log/log-file.log"
  format: json
# Configuring a buffer of 100 lines
accessLog:
  bufferingSize: 100
  filePath: "/var/log/log-access.log"
entryPoints:
  web:
    address: :80
  websecure:
    address: :443
    forwardedHeaders:
      trustedIPs: 
        - 173.245.48.0/20
        - 103.21.244.0/22
        - 103.22.200.0/22
        - 103.31.4.0/22
        - 141.101.64.0/18
        - 108.162.192.0/18
        - 190.93.240.0/20
        - 188.114.96.0/20
        - 197.234.240.0/22
        - 198.41.128.0/17
        - 162.158.0.0/15
        - 104.16.0.0/13
        - 104.24.0.0/14
        - 172.64.0.0/13
        - 131.0.72.0/22
        - 2400:cb00::/32
        - 2606:4700::/32
        - 2803:f800::/32
        - 2405:b500::/32
        - 2405:8100::/32
        - 2a06:98c0::/29
        - 2c0f:f248::/32
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: frontend
certificatesResolvers:
  letsencrypt_live:
    acme:
      storage: acme.json
      caServer: https://acme-v02.api.letsencrypt.org/directory
      httpChallenge:
        entryPoint: web
  letsencrypt_test:
    acme:
      storage: acme-test.json
      caServer: https://acme-staging-v02.api.letsencrypt.org/directory
      httpChallenge:
        entryPoint: web
